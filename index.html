<!DOCTYPE html>
<html>

}

header{
background:black;
color:white;

padding:20px;
font-size:30px;
font-weight:bold;
}

.produtos{
display:flex;
flex-wrap:wrap;
justify-content:center;

}

.card img{
width:100%;

}

.botao{
display:inline-block;
background:black;
color:white;
padding:10px 20px;
border-radius:10px;
text-decoration:none;

}

</head>

</div>

<div class="card">
